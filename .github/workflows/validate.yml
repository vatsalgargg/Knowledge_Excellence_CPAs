# Main CI. A "changes" job works out which areas a push or pull request touches
# (scripts/ci/changed-areas.mjs) and each check runs only when its area changed.
# The secret scan always runs. Scheduled, manual, new-branch and force-push runs,
# and any edit to this pipeline, run everything.
# Branch protection should require only "CI passed": skipped jobs count as passed,
# failed or cancelled ones do not. production-smoke.yml then checks the live site.
# Actions are pinned to commit SHAs (Dependabot keeps them current); downloaded
# tools are verified against pinned SHA-256 checksums before they run.
name: Validate Static Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full run: new CVEs, browser updates and the security.txt expiry do not
    # need a code change to break things.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.areas.outputs.dependencies }}
      code: ${{ steps.areas.outputs.code }}
      styles: ${{ steps.areas.outputs.styles }}
      site: ${{ steps.areas.outputs.site }}
      html: ${{ steps.areas.outputs.html }}
      spelling: ${{ steps.areas.outputs.spelling }}
      grammar: ${{ steps.areas.outputs.grammar }}
      browser: ${{ steps.areas.outputs.browser }}
      workflows: ${{ steps.areas.outputs.workflows }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out which checks this change needs
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          all=false
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) all=true ;;
          esac
          # New branches (all-zero SHA) and force pushes (old SHA gone) have no
          # trustworthy diff, so they run everything.
          if [ "$all" = false ] && { [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; }; then
            echo "No usable base commit ($base); running every check"
            all=true
          fi
          if [ "$all" = true ]; then
            git ls-files | ALL=true node scripts/ci/changed-areas.mjs
          else
            git diff --name-only "$base" HEAD | node scripts/ci/changed-areas.mjs
          fi

  dependencies:
    name: Dependencies (audit, signatures, review)
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Verify dependency signatures and provenance
        run: npm audit signatures

      - name: Block new vulnerable or unsafely licensed dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  code:
    name: Code (ESLint, syntax, security unit tests, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check worker.js

      - name: Lint JavaScript for bugs and unsafe code (ESLint)
        run: npm run lint:js

      - name: Verify security boundaries (unit tests)
        run: npm run test:security

      - name: Build site
        run: npm run build

  styles:
    name: Styles (Stylelint)
    needs: changes
    if: needs.changes.outputs.styles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint CSS for invalid properties, values and units
        run: npm run lint:css

  site:
    name: Site integrity, leaks, SEO and Cloudflare config
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check deployed files (integrity, leaks, limits, CSP, SEO)
        run: npm run check:site

      - name: Check Cloudflare config
        run: |
          grep -q '^main = "worker.js"$' wrangler.toml
          grep -q '^\[assets\]$' wrangler.toml
          grep -q '^directory = "\./"$' wrangler.toml
          grep -q '^binding = "ASSETS"$' wrangler.toml
          grep -Fxq 'run_worker_first = ["/", "/index", "/index.html"]' wrangler.toml

          grep -q 'Strict-Transport-Security:' _headers
          grep -q 'Content-Security-Policy:' _headers
          grep -q '^/\.well-known/security\.txt$' _headers
          grep -q '^/security\.txt /\.well-known/security\.txt 301$' _redirects

          echo "Cloudflare config looks valid"

      - name: Check security.txt (fails 30 days before expiry)
        run: |
          security_file=".well-known/security.txt"

          grep -q '^Contact: mailto:' "$security_file"
          grep -q '^Canonical: https://knowledgeexcellencecpa.com/\.well-known/security\.txt$' "$security_file"
          grep -q '^Expires: ' "$security_file"
          grep -q '^Preferred-Languages: ' "$security_file"

          expires=$(awk '/^Expires: / {print $2}' "$security_file")
          python3 - "$expires" <<'PY'
          import datetime
          import sys

          value = sys.argv[1].replace("Z", "+00:00")
          expires = datetime.datetime.fromisoformat(value)
          now = datetime.datetime.now(datetime.timezone.utc)

          if expires <= now + datetime.timedelta(days=30):
              raise SystemExit(f"security.txt expires {expires:%Y-%m-%d}; renew the Expires date")
          PY

          echo "security.txt looks valid"

  html:
    name: HTML validity and accessibility markup
    needs: changes
    if: needs.changes.outputs.html == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate HTML
        run: npm run lint:html

  spelling:
    name: Spelling (cspell)
    needs: changes
    if: needs.changes.outputs.spelling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check spelling
        run: npm run lint:spelling

  secrets:
    # Any file can leak a secret, so this always runs.
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  grammar:
    name: Grammar and punctuation (LanguageTool)
    needs: changes
    if: needs.changes.outputs.grammar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LT_VERSION: "6.6"
      LT_SHA256: "53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631"
      LT_URL: http://127.0.0.1:8081
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache LanguageTool
        id: lt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/LanguageTool-${{ env.LT_VERSION }}.zip
          key: languagetool-${{ env.LT_VERSION }}-${{ env.LT_SHA256 }}

      - name: Download LanguageTool
        if: steps.lt-cache.outputs.cache-hit != 'true'
        run: |
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/LanguageTool-${LT_VERSION}.zip" \
            "https://languagetool.org/download/LanguageTool-${LT_VERSION}.zip"

      - name: Verify and start LanguageTool server
        run: |
          echo "${LT_SHA256}  $RUNNER_TEMP/LanguageTool-${LT_VERSION}.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/LanguageTool-${LT_VERSION}.zip" -d "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/LanguageTool-${LT_VERSION}" && \
            nohup java -cp languagetool-server.jar org.languagetool.server.HTTPServer --port 8081 > "$RUNNER_TEMP/lt.log" 2>&1 &)
          for _ in $(seq 1 60); do
            curl --silent --fail "$LT_URL/v2/languages" > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/lt.log"
          exit 1

      - name: Check grammar of all visitor-facing copy
        run: node scripts/check-grammar.mjs

  browser:
    name: Browser journeys (Chrome, Android, iPhone Safari, Firefox)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run journeys, accessibility (axe WCAG 2.1 AA) and security checks in every engine
        run: npx playwright test --project=desktop --project=mobile --project=iphone --project=firefox

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  responsive:
    name: Responsive layout (12 screen sizes, 320px to 2560px)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check overflow, tap targets, text size and images at every size
        run: npm run test:responsive

      - name: Upload screenshots of every page at every size
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-screenshots
          path: test-results/**/*.png
          retention-days: 7

  lighthouse:
    name: Lighthouse (performance, a11y, best practices, SEO)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check score and Core Web Vitals budgets on phone and desktop
        run: npm run check:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

  workflows:
    name: Workflow security (actionlint + zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows with actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Audit workflow security with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --min-severity low .github/workflows

  ci-passed:
    # The single required status check. Skipped jobs (nothing they cover changed)
    # count as passed; a failed or cancelled job fails CI.
    name: CI passed
    if: always()
    needs: [changes, dependencies, code, styles, site, html, spelling, secrets, grammar, browser, responsive, lighthouse, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null \
            || { echo "::error::One or more CI jobs failed or were cancelled"; exit 1; }
          echo "$RESULTS" | jq -e '.changes.result == "success"' > /dev/null \
            || { echo "::error::Change detection did not run"; exit 1; }

  production-smoke:
    name: Production smoke test (after deploy)
    needs: ci-passed
    if: always() && needs.ci-passed.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    # './' is the long-supported reusable-workflow form and actionlint understands it.
    uses: ./.github/workflows/production-smoke.yml # zizmor: ignore[self-repository]
    with:
      wait-for-deploy: true
