# Checks the LIVE site. Runs daily, on demand, and from validate.yml after every
# job passes on a push to main (a reusable call replaces the riskier workflow_run trigger).
name: Production Smoke Test

on:
  workflow_call:
    inputs:
      wait-for-deploy:
        description: Wait for Cloudflare to finish deploying the pushed commit
        type: boolean
        default: false
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke live site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SITE_URL: https://knowledgeexcellencecpa.com

    steps:
      - name: Wait for Cloudflare deployment
        if: inputs.wait-for-deploy
        run: sleep 90

      - name: Check homepage headers
        run: |
          headers=$(mktemp)
          body=$(mktemp)

          curl --silent --show-error --location --dump-header "$headers" --output "$body" "$SITE_URL/"

          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^content-security-policy:' "$headers"
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^link: .*\.well-known/security\.txt' "$headers"
          grep -qi 'Knowledge Excellence CPAs' "$body"

          echo "Homepage is reachable and security headers are present"

      - name: Check security.txt
        run: |
          headers=$(mktemp)
          body=$(mktemp)

          curl --silent --show-error --dump-header "$headers" --output "$body" "$SITE_URL/.well-known/security.txt"

          grep -qi '^content-type: text/plain' "$headers"
          grep -q '^Contact: mailto:support@knowledgeexcellencecpa.com$' "$body"
          grep -q '^Canonical: https://knowledgeexcellencecpa.com/\.well-known/security\.txt$' "$body"
          grep -q '^Expires: ' "$body"

          echo "security.txt is reachable"

      - name: Check security.txt redirect
        run: |
          headers=$(mktemp)

          curl --silent --show-error --dump-header "$headers" --output /dev/null "$SITE_URL/security.txt"

          status=$(awk 'NR == 1 { print $2 }' "$headers")
          if [ "$status" != "301" ] && [ "$status" != "302" ] && [ "$status" != "308" ]; then
            echo "/security.txt returned $status instead of a redirect"
            cat "$headers"
            exit 1
          fi

          location=$(awk 'tolower($1) == "location:" { print $2 }' "$headers" | tr -d '\r')
          case "$location" in
            "/.well-known/security.txt"|"${SITE_URL}/.well-known/security.txt")
              ;;
            *)
              echo "/security.txt redirected to unexpected location: $location"
              cat "$headers"
              exit 1
              ;;
          esac

          echo "/security.txt redirects to /.well-known/security.txt"

      - name: Check robots and sitemap
        run: |
          curl --silent --show-error --fail "$SITE_URL/robots.txt" | grep -q '^Sitemap: https://knowledgeexcellencecpa.com/sitemap.xml$'
          curl --silent --show-error --fail "$SITE_URL/sitemap.xml" | grep -q '<loc>https://knowledgeexcellencecpa.com/</loc>'

          echo "robots.txt and sitemap.xml are reachable"

      - name: Reject internal file exposure
        run: |
          for path in worker.js wrangler.toml package.json package-lock.json _headers _redirects .env .dev.vars .git/config \
            RULES.md README.md scripts/security.test.js scripts/check-site.mjs playwright.config.mjs cspell.json .gitleaks.toml \
            .github/workflows/validate.yml output/video/kecpa-partnership-4k.mp4 node_modules/vite/package.json; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$SITE_URL/$path")
            if [ "$status" != "404" ]; then
              echo "Internal path /$path returned $status; expected 404"
              exit 1
            fi
          done

      - name: Check legal pages load without redirect loops
        run: |
          for page in privacy terms; do
            final=$(curl --silent --show-error --location --max-redirs 3 --output /dev/null \
              --write-out '%{http_code} %{url_effective}' "$SITE_URL/$page.html")
            if [ "$final" != "200 $SITE_URL/$page" ]; then
              echo "/$page.html ended at '$final'; expected '200 $SITE_URL/$page'"
              exit 1
            fi
          done
          echo "Legal pages load"

      - name: Check unknown pages return the branded 404
        run: |
          body=$(mktemp)
          status=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$SITE_URL/this-page-does-not-exist")
          [ "$status" = "404" ] || { echo "Unknown page returned $status"; exit 1; }
          grep -q 'Page not found | Knowledge Excellence CPAs' "$body"
          echo "404 page is served"

      - name: Check CSP and asset delivery
        run: |
          headers=$(mktemp)
          curl --silent --show-error --dump-header "$headers" --output /dev/null "$SITE_URL/"
          grep -qi "^content-security-policy:.*object-src 'none'" "$headers"
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" "$headers"

          curl --silent --show-error --fail --dump-header "$headers" --output /dev/null "$SITE_URL/fonts/inter-latin.woff2"
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$headers"

          for asset in index.css script.js fonts.css legal.css kecpa-video-1080.av1.mp4 kecpa-video-720.mp4 kecpa-video.en.vtt; do
            curl --silent --show-error --fail --head --output /dev/null "$SITE_URL/$asset" || { echo "/$asset is not reachable"; exit 1; }
          done
          echo "CSP and assets look right"

      - name: Check AI agents receive Markdown
        run: |
          curl --silent --show-error --fail --header 'Accept: text/markdown' "$SITE_URL/" | head -1 | grep -q '^# Knowledge Excellence CPAs'

  outbound-links:
    name: Outbound links still work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check every outbound link
        run: node scripts/check-site.mjs --external
