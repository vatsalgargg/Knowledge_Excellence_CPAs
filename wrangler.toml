name = 'kecpa'
compatibility_date = "2026-04-22"
main = "worker.js"

# Only homepage content negotiation needs the Worker before static assets.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/", "/index", "/index.html"]

# Keep only explicit, redacted application errors; invocation logs contain URLs.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
